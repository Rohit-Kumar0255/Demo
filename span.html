
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      background-color: rgb(14, 107, 123);
    }
    .form {
      background-color: rgb(68, 188, 227);
      padding: 20px;
      border: 60px;
      border-color: rgb(0, 0, 0);
      border-radius: 10px;
      width: 400px;
      height: 600px;
      margin: 0 auto;
    }
    #logo {
      font-size: 20px;
      font-weight: bold;
      color: white;
      text-align: center;
      display: block;
      margin-bottom: 5px;
    }
    #username,
    #password {
      width: 80%;
      padding: 10px;
      margin-bottom: 10px;
      margin-left: 20px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    #login,
    #submit {
      background-color: rgb(0, 0, 0);
      color: white;
      padding: 10px 20px;
      margin-left: 150px;
      /* display: block; */
      /* justify-content: center; */
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
  <body>
    <span id="logo">LOGO</span>
    <br />
    <br />
    <form action="Submit" method="get" class="form">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required />
      <br />
      <label for="password">Password :</label>
      <input type="password" id="password" name="password" required />
      <br />
      <br />
      <!-- <input type="login" value="Login" id="login" /> -->
      <button type="submit" id="login">Login</button>
      <br />
      <br />
      <label>Gender:</label>
      <input type="radio" id="male" name="Gender" value="Male" />
      <label for="male">Male</label>
      <input type="radio" id="female" name="Gender" value="Female" />
      <label for="female">Female</label>
      <br />
      <h4>Hobbies</h4>
      <input type="checkbox" id="subscribe" name="newsletter" value="yes" />
      <label for="subscribe">Hardwork</label>
      <br />
      <input type="checkbox" id="1" name="newsletter" value="yes" />
      <label for="1">Football</label>
      <br />
      <input type="checkbox" id="2" name="newsletter" value="yes" />
      <label for="2">Real problem Solving</label>
      <br />
      <input type="checkbox" id="3" name="newsletter" value="yes" />
      <label for="3">Learning</label>
      <br />
      <br />
      <label for="cars">Car:</label>
      <select name="cars" id="cars">
        <option value="volvo">Volvo</option>
        <option value="saab">Saab</option>
        <option value="mercedes">Mercedes</option>
        <option value="audi">Audi</option>
      </select>
      <br />
      <br />
      <label>Message:</label>
      <br />
      <textarea
        name="message"
        id="message"
        rows="4"
        cols="50"
        placeholder="Enter your message"
      ></textarea>
      <br />
      <br />
      <button type="submit" id="submit">Submit</button>
    </form>
  </body>
</html>
